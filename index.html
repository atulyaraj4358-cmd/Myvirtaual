<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Android</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0e1116">
</head>
<body>
<div id="phone">
  <div id="status"><span id="clock"></span><span id="batt"></span></div>
  <div id="screen" data-wp="0">
    <div id="home"></div>
    <div id="app" hidden></div>
    <div id="recents" hidden></div>
  </div>
  <nav id="nav">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <button id="back" aria-label="Back">&#9665;</button>
    <button id="homebtn" aria-label="Home">&#9675;</button>
    <button id="rec" aria-label="Recent apps">&#9633;</button>
  </nav>
</div>
<script src="extras.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
